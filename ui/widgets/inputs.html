<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestLap — Input Telemetry</title>
    <link rel="stylesheet" href="/styles/theme.css" />
    <link rel="stylesheet" href="/styles/widget-chrome.css" />
    <link rel="stylesheet" href="/styles/inputs.css" />
  </head>
  <body>
    <div class="detached-widget-frame" id="frame">
      <div class="widget-content-slot" id="inputs-root"></div>
    </div>

    <script type="module">
      import { TelemetryClient } from '/js/ws-client.js';
      import { initDetachedWidgetShell } from '/js/widget-shell.js';
      import { InputsWidget } from '/js/widgets/inputs.js';

      initDetachedWidgetShell(document.getElementById('frame'), 'Input Telemetry');

      const inputsWidget = new InputsWidget(document.getElementById('inputs-root'));
      const client = new TelemetryClient();
      client.onFrame((frame) => inputsWidget.render(frame));
      client.connect();
    </script>
  </body>
</html>
