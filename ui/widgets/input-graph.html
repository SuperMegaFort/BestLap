<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestLap — Input Graph</title>
    <link rel="stylesheet" href="/styles/theme.css" />
    <link rel="stylesheet" href="/styles/widget-chrome.css" />
    <link rel="stylesheet" href="/styles/input-graph.css" />
  </head>
  <body>
    <div class="detached-widget-frame" id="frame">
      <div class="widget-content-slot" id="ig-root"></div>
    </div>

    <script type="module">
      import { TelemetryClient } from '/js/ws-client.js';
      import { initDetachedWidgetShell } from '/js/widget-shell.js';
      import { InputGraphWidget } from '/js/widgets/input-graph.js';

      initDetachedWidgetShell(document.getElementById('frame'), 'Input Graph');

      const widget = new InputGraphWidget(document.getElementById('ig-root'));
      const client = new TelemetryClient();
      client.onFrame((frame) => widget.render(frame));
      client.connect();
    </script>
  </body>
</html>
