<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestLap — Relative</title>
    <link rel="stylesheet" href="/styles/theme.css" />
    <link rel="stylesheet" href="/styles/widget-chrome.css" />
    <link rel="stylesheet" href="/styles/leaderboard.css" />
    <link rel="stylesheet" href="/styles/relative.css" />
  </head>
  <body>
    <div class="detached-widget-frame" id="frame">
      <div class="widget-content-slot" id="rel-root"></div>
    </div>

    <script type="module">
      import { TelemetryClient } from '/js/ws-client.js';
      import { initDetachedWidgetShell } from '/js/widget-shell.js';
      import { RelativeWidget } from '/js/widgets/relative.js';

      initDetachedWidgetShell(document.getElementById('frame'), 'Relative');

      const client = new TelemetryClient();
      const relative = new RelativeWidget(document.getElementById('rel-root'), {
        onSelectDriver: (driverId) => client.send({ type: 'set-focus', driverId }),
      });
      client.onFrame((frame) => relative.render(frame));
      client.connect();
    </script>
  </body>
</html>
