[package]
name = "bestlap"
version = "0.2.0"
edition = "2021"
description = "100% Rust sim-racing overlay for Le Mans Ultimate on Linux"

[[bin]]
name = "bestlap"
path = "rust/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["glow", "wayland", "x11"] }
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }
dirs = "6.0"
